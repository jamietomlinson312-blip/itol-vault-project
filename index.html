<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <link rel="stylesheet" href="src/output.css">
    <script src="https://kit.fontawesome.com/0f31ee50d3.js" crossorigin="anonymous"></script>
</head>
<body class="bg-neutral-100 font-nunito">
    <header class="fixed top-0 left-0 w-full ">
        <div class="p-7 mx-2 flex justify-between">
            <div class="">
                <h3 class="font-extrabold">My ITOL Vault</h3>
            </div>
            <div class="">
                <div class="flex gap-3 items-center">
                    <a href= "new-entry.html" class="py-1 px-2 text-xs text-Platinum bg-black rounded-md shadow-md
                     transition ease-in-out duration-100 delay-100 hover:bg-neutral-100 hover:text-black">New Entry</a>
                    <a href="index.html"><i class="fa-solid fa-circle-user" style="color: rgb(0, 0, 0);"></i></a>
                </div>
            </div>
        </div>
    </header>
    <main class="max-w-8/10 mt-30 mx-auto">
        <section class="max-w-1/3 flex flex-col gap-4">
            <h1 class="text-4xl font-extrabold">Daily Reflections</h1>
            <p class="text-sm text-neutral-400">A sanctuary for your thoughts. Captured in the quiet moments bewtween the noise of the world.</p>
        </section>
        <!-- Grid Section -->
         <section id = "grid-section" class="mt-10 grid grid-cols-3 grid-rows-2 gap-8">
         </section>

         <!-- New post section -->
        <section>
            <div class="mt-10 py-16 flex flex-col gap-4 items-center border-1 border-dashed border-neutral-300">
                <i class="fa-regular fa-pen-to-square fa-2xl fa-width-auto" style="color: rgb(130, 130, 130);"></i>
                <h3 class="text-lg font-extrabold">Feeling Inspired?</h3>
                <p class="text-xs text-neutral-500">Your Vellum is waiting for its next entry.</p>
                <a href="new-entry.html" class="mt-2 font-bold underline">Start Writing Now</a>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="mt-10">
        <div class="p-3 mx-2 flex justify-between">
            <div class="">
                <h3 class="font-light text-sm">&copy 2026 My ITOL Vault. Designed for reflection.</h3>
            </div>
            <div class="text-neutral-400 text-xs">
                <div class="flex gap-3 items-center">
                    <a>Privacy</a>
                    <a>Terms</a>
                    <a>Archive</a>
                </div>
            </div>
        </div>
    </footer>
    <script src="home.js"></script>
</body>
</html>
