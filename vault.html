<!DOCTYPE html>

<head>

    <title>Vault</title>
    <link rel="stylesheet" href="src/output.css">

<body class="bg-neutral-100 font-nunito">
    <!-- Header section -->
    <header class="fixed top-0 left-0 z-50 w-full ">
        <div class="p-7 mx-2 flex flex-col items-center gap-4 sm:flex-row justify-between">
            <div class="">
                <h3 class="font-extrabold">The Digital Vellum</h3>
            </div>
            <div class="flex gap-4 justify-around text-lg font-bold text-neutral-400">
                <a>Journal</a>
                <a class="text-black font-extrabold underline">Vault</a>
                <a>Collections</a>
                <a>Settings</a>
            </div>
            <div class="">
                <div class="flex gap-3 items-center">
                    <a href= "new-entry.html" class="py-1 px-2 text-xs text-Platinum bg-black rounded-md shadow-md
                    transition ease-in-out duration-100 delay-100 hover:bg-neutral-100 hover:text-black">New Entry</a>

        <div id="card-section" class="">

        <div class="p-3 mx-2 flex justify-between">
            <div class="">
                <h3 class="font-light text-sm">&copy 2026 My ITOL Vault. Designed for reflection.</h3>
            </div>
            <div class="text-neutral-400 text-xs">
                <div class="flex gap-3 items-center">
                    <a>Privacy</a>
                    <a>Terms</a>
                    <a>Archive</a>
